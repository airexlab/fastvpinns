[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvpinns"
version = "1.0.2"
authors = [
  { name="Thivin Anandh", email="thivinanandh@gmail.com" },
  { name="Divij Ghose", email="divijghose@gmail.com" },
  { name="Sashikumaar Ganesan", email="sashi@iisc.ac.in" }
]
description = "A fast tensor-driven variational physics-informed neural network library for solving PDEs."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["PDE", "Neural Networks", "Physics", "AI", "Machine Learning","variational PINNs", "VPINNs", "PINNs", "Physics-informed neural networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  "numpy>=1.21,<=1.23.5; python_version < '3.12'",
  "numpy>=1.26,<3; python_version >= '3.12'",
  "pandas<1.4.4; python_version < '3.12'",
  "pandas>=2.1,<3; python_version >= '3.12'",
  "matplotlib>=3.5",
  "tensorflow>=2.9.1,<=2.13.0; python_version < '3.12'",
  "meshio==5.3.4"
  "pyDOE==0.3.8",
  "tqdm==4.66.2",
  "scipy>=1.8",
  "gmsh==4.11.0",
  "pyyaml>=6",
  "rich==12.5.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.0.2",
  "black>=24",
  "pre-commit>=3.6"
]


[project.urls]
Homepage = "https://github.com/cmgcds/fastvpinns"
Issues = "https://github.com/cmgcds/fastvpinns/issues"
Documentation = "https://cmgcds.github.io/fastvpinns/"
logo = "https://raw.githubusercontent.com/cmgcds/fastvpinns/main/Fastvpinns_logo.png"

[tool.setuptools]
include-package-data = true
[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$|\.py$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
skip-string-normalization = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
